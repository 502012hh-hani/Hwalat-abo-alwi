name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore Android project from source archive
        shell: bash
        run: |
          unzip -oq HawalatAbuAlawi-source.zip -d "$RUNNER_TEMP/hawalat-source"
          test -f "$RUNNER_TEMP/hawalat-source/build.gradle"
          test -f "$RUNNER_TEMP/hawalat-source/settings.gradle"
          test -f "$RUNNER_TEMP/hawalat-source/gradle.properties"
          test -f "$RUNNER_TEMP/hawalat-source/app/build.gradle"
          test -f "$RUNNER_TEMP/hawalat-source/app/src/main/AndroidManifest.xml"
          cp "$RUNNER_TEMP/hawalat-source/build.gradle" ./build.gradle
          cp "$RUNNER_TEMP/hawalat-source/settings.gradle" ./settings.gradle
          cp "$RUNNER_TEMP/hawalat-source/gradle.properties" ./gradle.properties
          rm -rf app
          cp -a "$RUNNER_TEMP/hawalat-source/app" ./app
          mkdir -p app/src/main/java/com/abualawi/hawalat
          cp patched-src/MainActivity.java app/src/main/java/com/abualawi/hawalat/MainActivity.java
          cp patched-src/WhatsAppNotificationListener.java app/src/main/java/com/abualawi/hawalat/WhatsAppNotificationListener.java
          cp patched-src/KeepAliveService.java app/src/main/java/com/abualawi/hawalat/KeepAliveService.java
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifest application element is missing")
          # Android 10 / targetSdk 28: keep legacy public Downloads access for the app.
          app.set(android + "requestLegacyExternalStorage", "true")
          service = None
          for item in app.findall("service"):
              name = item.get(android + "name", "")
              if name in (".WhatsAppNotificationListener", "com.abualawi.hawalat.WhatsAppNotificationListener"):
                  service = item
                  break
          if service is None:
              service = ET.SubElement(app, "service")
              service.set(android + "name", ".WhatsAppNotificationListener")
          service.set(android + "permission", "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE")
          service.set(android + "exported", "true")
          has_action = False
          for filt in service.findall("intent-filter"):
              for action in filt.findall("action"):
                  if action.get(android + "name") == "android.service.notification.NotificationListenerService":
                      has_action = True
          if not has_action:
              filt = ET.SubElement(service, "intent-filter")
              ET.SubElement(filt, "action").set(android + "name", "android.service.notification.NotificationListenerService")
          keepalive = None
          for item in app.findall("service"):
              if item.get(android + "name", "") in (".KeepAliveService", "com.abualawi.hawalat.KeepAliveService"):
                  keepalive = item
                  break
          if keepalive is None:
              keepalive = ET.SubElement(app, "service")
              keepalive.set(android + "name", ".KeepAliveService")
          keepalive.set(android + "exported", "false")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Notification listener and foreground keep-alive services verified")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'
          ]
          end = s.find(">", s.find("<manifest"))
          if end < 0:
              raise SystemExit("Manifest opening tag not found")
          for permission in permissions:
              if permission not in s:
                  s = s[:end + 1] + "\n    " + permission + s[end + 1:]
                  end = s.find(">", s.find("<manifest"))
          p.write_text(s)
          PY

      - name: Prepare permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing GitHub secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing GitHub secret: ANDROID_KEY_ALIAS"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hawalat-release.p12"
          test -s "$RUNNER_TEMP/hawalat-release.p12"
          echo "HAWALAT_STORE_FILE=$RUNNER_TEMP/hawalat-release.p12" >> "$GITHUB_ENV"

      - name: Configure Gradle release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          if "signingConfigs" not in s:
              block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("HAWALAT_STORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          '''
              m = re.search(r'android\\s*\\{', s)
              if not m:
                  raise SystemExit("Could not locate android { block in app/build.gradle")
              pos = m.end()
              s = s[:pos] + "\\n" + block + s[pos:]
          p.write_text(s)
          print("Permanent release signing configured")
          PY

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test "$(stat -c%s app/build/outputs/apk/release/app-release.apk)" -gt 10000
          unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Save signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hawalat-Abu-Alawi
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
